name: ZenithOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (NASM, TCC, build tools)
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm build-essential wget
        # 下载 TCC 的 Linux 版本并安装
        wget https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.27-linux-x86_64.tar.bz2
        tar xjf tcc-0.9.27-linux-x86_64.tar.bz2
        sudo cp -r tcc-0.9.27-linux-x86_64/* /usr/local/
        sudo ldconfig
    
    - name: Build OS
      run: node build.js
