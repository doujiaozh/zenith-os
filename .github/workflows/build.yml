name: ZenithOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build floppy image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install toolchain (NASM + TCC + GNU binutils)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm tcc binutils

      - name: Build ZenithOS
        run: node build.js

      - name: Verify image contract
        run: |
          set -eu
          test "$(stat -c%s zenithos.img)" = "1474560"
          test "$(stat -c%s build/boot.bin)" = "512"
          test "$(stat -c%s build/kernel.bin)" -le 61440
          test "$(od -An -tx1 -N2 -j510 build/boot.bin | tr -d ' \n')" = "55aa"
          sha256sum zenithos.img build/boot.bin build/kernel.bin
          cat build/report.json

      - name: Upload image + provenance
        uses: actions/upload-artifact@v4
        with:
          name: zenithos-image
          path: |
            zenithos.img
            build/boot.bin
            build/kernel.bin
            build/report.json

  visual-regression:
    name: Headless v86 visual regression
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install toolchain (NASM + TCC + GNU binutils)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm tcc binutils

      - name: Install emulator dependency
        run: npm ci

      - name: Build image
        run: node build.js

      - name: Boot headlessly and capture the desktop
        run: |
          node tools/emulate.mjs \
            --image build/zenithos.img \
            --seconds 10 \
            --keys "w,a,s,d,r" \
            --out screenshots/emu-ci.png \
            --serial build/serial-ci.log

      - name: Show boot serial log
        if: always()
        run: cat build/serial-ci.log || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenithos-screenshots
          path: |
            screenshots/emu-ci*.png
            build/serial-ci.log
