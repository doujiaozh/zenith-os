name: ZenithOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (NASM, GCC, binutils)
      run: |
        sudo apt-get update && sudo apt-get install -y gcc nasm binutils

    - name: Build OS
      run: |
        set -o pipefail
        node build.js 2>&1 | tee build.log

    - name: Surface build failure
      if: failure()
      run: |
        # GitHub's annotation engine does not parse build.js's FATAL format,
        # so re-emit the failure span as an explicit workflow error command.
        # The tool output that caused it sits just above the FATAL line.
        msg=$(grep -B22 -A6 'FATAL' build.log 2>/dev/null | tr '\r\n' '  ' | head -c 4000)
        if [ -z "$msg" ]; then
          msg="no FATAL line; last output: $(tail -c 1500 build.log 2>/dev/null | tr '\r\n' '  ')"
        fi
        echo "::error title=Build OS failed::$msg"
