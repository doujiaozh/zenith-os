name: ZenithOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (NASM, GCC, binutils)
      run: |
        sudo apt-get update && sudo apt-get install -y gcc nasm binutils

    - name: Build OS
      run: node build.js
